spring:
  application:
    name: srm-backend-test
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:srm_test_${random.uuid};MODE=LEGACY;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      continue-on-error: false
      # 测试环境用 H2 兼容的轻量 schema（仅建模块 1 需要的 sys_user 表），
      # 避免主 schema.sql 中 MySQL 专属语法（生成列）在 H2 上失败
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"

srm:
  seed-demo-users: false
  jwt:
    secret: srm-test-jwt-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
    expiration-ms: 86400000

logging:
  level:
    com.srm.core: warn
