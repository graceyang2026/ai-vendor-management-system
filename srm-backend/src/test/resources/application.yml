spring:
  application:
    name: srm-backend-test
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:srm_test_${random.uuid};MODE=LEGACY;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"

srm:
  jwt:
    secret: test-only-secret-key-please-override-in-dotenv-file-min-32-chars
    expiration-minutes: 480
  seed-demo-users: false

logging:
  level:
    com.srm.core: warn
